server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Force la revalidation : le navigateur récupère toujours la dernière version
    # des fichiers (JS/CSS/HTML) après modification, sans cache obsolète.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
